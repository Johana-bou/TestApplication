name: Build DouaneGestion MSI (Standalone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    name: 🐍 Backend → .exe autonome
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afficher l'environnement Python
        run: |
          where python
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Installer dépendances (verbose)
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --verbose uvicorn fastapi sqlalchemy pydantic anyio python-multipart python-dotenv pyinstaller

      - name: Lister tous les paquets installés
        run: |
          python -m pip list

      - name: Vérifier uvicorn avec pip show
        run: |
          python -m pip show uvicorn || echo "uvicorn n'est pas installé"

      - name: Tenter l'import de uvicorn
        run: |
          python -c "import uvicorn; print('OK')"

      - name: Compiler avec PyInstaller (si import réussi)
        run: |
          cd backend
          pyinstaller --onefile --name run --console --collect-all uvicorn run.py --clean --noconfirm
        if: success()

      - uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: backend/dist/run.exe
        if: success()

  build-msi:
    name: ⚛️ Electron → Setup Windows standalone
    runs-on: windows-2022
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer backend.exe
        uses: actions/download-artifact@v4
        with:
          name: backend-exe
          path: electron/resources/backend/

      - name: Build React (Vite)
        run: |
          cd douanes-app
          npm install
          npm run build

      - name: Copier build React → electron/renderer
        run: |
          xcopy /E /I /Y douanes-app\dist electron\renderer

      - name: Supprimer tous les fichiers .ico (évite l'erreur 256x256)
        run: |
          Get-ChildItem -Path electron -Recurse -Filter *.ico | Remove-Item -Force
          Get-ChildItem -Path electron -Recurse -Filter icon.png | Remove-Item -Force

      - name: Nettoyer les caches npm
        run: |
          cd electron
          npm cache clean --force
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue

      - name: Générer le Setup Windows
        run: |
          cd electron
          npm install
          npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: 📦 Publier le Setup Windows
        uses: actions/upload-artifact@v4
        with:
          name: DouaneGestion-Setup-Windows
          path: electron/dist/*.exe
          retention-days: 30