name: Build DouaneGestion MSI (Standalone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    name: 🐍 Backend → .exe autonome
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afficher le contenu de run.spec (debug)
        run: cat backend/run.spec

      - name: Installer dépendances + PyInstaller
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler en .exe autonome
        run: |
          cd backend
          pyinstaller run.spec --clean --noconfirm

      - name: Vérifier le .exe généré
        run: dir backend\dist\

      - uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: backend/dist/run.exe

  build-msi:
    name: ⚛️ Electron → Setup Windows standalone
    runs-on: windows-2022
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🔧 Nettoyage complet avant toute chose
      - name: Supprimer l'icône potentiellement problématique
        run: |
          if (Test-Path "electron/assets/icon.ico") { Remove-Item "electron/assets/icon.ico" -Force }
          if (Test-Path "electron/assets/icon.png") { Remove-Item "electron/assets/icon.png" -Force }
          if (Test-Path "electron/icon.ico") { Remove-Item "electron/icon.ico" -Force }
          if (Test-Path "electron/icon.png") { Remove-Item "electron/icon.png" -Force }

      - name: Nettoyer complètement la configuration de l'icône dans package.json
        run: |
          cd electron
          $pkg = Get-Content package.json | ConvertFrom-Json
          # Supprimer toute propriété "icon" dans "win" et à la racine de "build"
          if ($pkg.build.win.PSObject.Properties.Name -contains "icon") {
            $pkg.build.win.PSObject.Properties.Remove("icon")
          }
          if ($pkg.build.PSObject.Properties.Name -contains "icon") {
            $pkg.build.PSObject.Properties.Remove("icon")
          }
          # Réécrire le fichier
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          # Vérification
          Write-Host "package.json après nettoyage :"
          Get-Content package.json | Select-String "icon"

      - name: Récupérer backend.exe
        uses: actions/download-artifact@v4
        with:
          name: backend-exe
          path: electron/resources/backend/

      - name: Build React (Vite)
        run: |
          cd douanes-app
          npm install
          npm run build

      - name: Copier build React → electron/renderer
        run: |
          xcopy /E /I /Y douanes-app\dist electron\renderer

      - name: Supprimer tous les fichiers .ico (évite l'erreur 256x256)
        run: |
          Get-ChildItem -Path electron -Recurse -Filter *.ico | Remove-Item -Force
          Get-ChildItem -Path electron -Recurse -Filter icon.png | Remove-Item -Force

      - name: Générer le Setup Windows
        run: |
          cd electron
          npm install
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Publier le Setup Windows
        uses: actions/upload-artifact@v4
        with:
          name: DouaneGestion-Setup-Windows
          path: electron/dist/*.exe
          retention-days: 30