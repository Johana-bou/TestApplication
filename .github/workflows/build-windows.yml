name: Build DouaneGestion (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:

  # ════════════════════════════════════════════
  # 🐍 BACKEND WINDOWS → run.exe
  # ════════════════════════════════════════════
  build-backend-windows:
    name: 🐍 Backend Windows → .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-windows-v2-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-windows-v2-

      - name: Installer dépendances + PyInstaller
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler en .exe autonome (commande directe)
        run: |
          cd backend
          pyinstaller --onefile --name run --console `
            --copy-metadata uvicorn `
            --copy-metadata fastapi `
            --copy-metadata starlette `
            --copy-metadata pydantic `
            --copy-metadata anyio `
            --copy-metadata click `
            --copy-metadata h11 `
            --copy-metadata sqlalchemy `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all starlette `
            --collect-all pydantic `
            --collect-all anyio `
            --collect-all click `
            --collect-all h11 `
            --collect-all sqlalchemy `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=uvicorn.lifespan.off `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.websockets `
            --hidden-import=uvicorn.logging `
            --add-data "app;app" `
            --add-data ".env;." `
            --add-data "douanes.db;." `
            run.py --clean --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: backend-exe-windows
          path: backend/dist/run.exe
          retention-days: 1

  # ════════════════════════════════════════════
  # ⚛️ ELECTRON WINDOWS → Setup NSIS .exe
  # ════════════════════════════════════════════
  build-windows:
    name: ⚛️ Electron → Setup Windows
    runs-on: windows-latest
    needs: build-backend-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm (React)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-react-windows-v2-${{ hashFiles('douanes-app/package-lock.json') }}
          restore-keys: npm-react-windows-v2-

      - name: Cache npm (Electron)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-electron-windows-v2-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: npm-electron-windows-v2-

      - name: Récupérer backend.exe
        uses: actions/download-artifact@v4
        with:
          name: backend-exe-windows
          path: electron/resources/backend/

      - name: Build React (Vite)
        run: |
          cd douanes-app
          npm ci
          npm run build

      - name: Copier build React → electron/renderer
        run: xcopy /E /I /Y douanes-app\dist electron\renderer

      - name: Supprimer icônes problématiques
        run: |
          Get-ChildItem -Path electron -Recurse -Filter *.ico | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path electron -Recurse -Filter icon.png | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Générer le Setup Windows
        run: |
          cd electron
          npm ci
          npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: 📦 Publier Setup Windows
        uses: actions/upload-artifact@v4
        with:
          name: DouaneGestion-Setup-Windows
          path: electron/dist/*.exe
          retention-days: 30
