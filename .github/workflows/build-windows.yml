name: Build DouaneGestion MSI (Standalone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    name: 🐍 Backend → .exe autonome
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances + PyInstaller
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Vérifier les imports Python (debug)
        run: |
          cd backend
          python -c "import uvicorn; print('uvicorn trouvé :', uvicorn.__file__)"

      - name: Compiler en .exe autonome (force inclusion de tous les modules)
        run: |
          cd backend
          pyinstaller --onefile --name run `
            --console `
            --log-level=DEBUG `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all starlette `
            --collect-all pydantic `
            --collect-all anyio `
            --collect-all sqlalchemy `
            --collect-all click `
            --collect-all h11 `
            --collect-all httptools `
            --collect-all websockets `
            --hidden-import=uvicorn.lifespan.on `
            --hidden-import=uvicorn.lifespan.off `
            --hidden-import=uvicorn.loops.auto `
            --hidden-import=uvicorn.protocols.http `
            --hidden-import=uvicorn.protocols.websockets `
            --hidden-import=uvicorn.logging `
            --add-data "app;app" `
            --add-data ".env;." `
            --add-data "douanes.db;." `
            run.py --clean --noconfirm

      - name: Tester le backend.exe (optionnel, vérifie l'absence d'erreur uvicorn)
        run: |
          cd backend/dist
          .\run.exe --help || echo "Le test a échoué, mais on continue pour voir les logs"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: backend/dist/run.exe

  build-msi:
    name: ⚛️ Electron → Setup Windows standalone
    runs-on: windows-2022
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer backend.exe
        uses: actions/download-artifact@v4
        with:
          name: backend-exe
          path: electron/resources/backend/

      - name: Build React (Vite)
        run: |
          cd douanes-app
          npm install
          npm run build

      - name: Copier build React → electron/renderer
        run: |
          xcopy /E /I /Y douanes-app\dist electron\renderer

      - name: Supprimer tous les fichiers .ico (évite l'erreur 256x256)
        run: |
          Get-ChildItem -Path electron -Recurse -Filter *.ico | Remove-Item -Force
          Get-ChildItem -Path electron -Recurse -Filter icon.png | Remove-Item -Force

      - name: Nettoyer les caches npm
        run: |
          cd electron
          npm cache clean --force
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue

      - name: Générer le Setup Windows
        run: |
          cd electron
          npm install
          npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: 📦 Publier le Setup Windows
        uses: actions/upload-artifact@v4
        with:
          name: DouaneGestion-Setup-Windows
          path: electron/dist/*.exe
          retention-days: 30