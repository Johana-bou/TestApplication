name: Build DouaneGestion MSI (Standalone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    name: 🐍 Backend → .exe autonome
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afficher le contenu de run.spec (debug)
        run: cat backend/run.spec

      - name: Installer dépendances + PyInstaller
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler en .exe autonome
        run: |
          cd backend
          pyinstaller run.spec --clean --noconfirm

      - name: Vérifier le .exe généré
        run: dir backend\dist\

      - uses: actions/upload-artifact@v4
        with:
          name: backend-exe
          path: backend/dist/run.exe

  build-msi:
    name: ⚛️ Electron → MSI standalone
    runs-on: windows-2022
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer backend.exe
        uses: actions/download-artifact@v4
        with:
          name: backend-exe
          path: electron/resources/backend/

      - name: Build React (Vite)
        run: |
          cd douanes-app
          npm install
          npm run build

      - name: Copier build React → electron/renderer
        run: |
          xcopy /E /I /Y douanes-app\dist electron\renderer

      - name: Générer le MSI
        run: |
          cd electron
          npm install
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Publier le MSI
        uses: actions/upload-artifact@v4
        with:
          name: DouaneGestion-Setup-Windows
          path: electron/dist/*.msi
          retention-days: 30
